<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c8102e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Rilievi Corrado Serramenti</title>
<style>
:root{--bg:#f1f1ef;--card:#fff;--ink:#1c1c1c;--mut:#6b6b6b;--red:#c8102e;--line:#c9c9c9;--ok:#1b7f3b;--hi:#fff1c2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:2px solid var(--red);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar select,.bar button{min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.tab{font-weight:600}
.tab.on{background:var(--red)!important;color:#fff;border-color:var(--red)!important}
.ver{font-size:12px;color:var(--mut)}
.sp{flex:1}
.wrap{padding:12px;max-width:1100px;margin:0 auto}
.page{background:var(--card);border:1px solid var(--line);margin:0 auto 18px;padding:10px;width:100%;max-width:794px}
.head{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:4px 14px;margin-bottom:8px}
.head h2{grid-row:span 3;margin:0;font-size:22px;letter-spacing:.12em;color:var(--red);align-self:center}
.head label{display:flex;gap:6px;font-size:13px;border-bottom:1px solid var(--ink);align-items:center}
.head label span{color:var(--mut);white-space:nowrap}
.head input{border:0;flex:1;min-width:0;background:transparent;padding:2px;font-size:14px}
.tr{border:1px dashed var(--line);border-radius:6px;padding:6px 8px;margin-bottom:8px;font-size:13px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-left:1px solid var(--ink)}
.cell{border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);min-height:240px;padding:6px;position:relative;cursor:pointer;display:flex;flex-direction:column;gap:3px;font-size:14px;align-items:stretch}
.cell:active{background:var(--hi)}
.cell .top{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#555;min-height:16px}
.cell .top b{font-size:13px;color:var(--ink)}
.stz{font-size:12px;font-weight:400;color:#444;margin:0 6px}
.cell .nt{font-size:12px;color:#333}
.cell .pos{margin-top:auto;font-size:13px;color:#333;padding-top:4px;padding-right:34px}
.cell .pos b{font-size:16px}
#pv{position:fixed;inset:0;background:#fff;z-index:60;display:none;overflow:auto}
#pv.on{display:block}
#pv img{width:100%;max-width:none;display:block}
#pvx{position:fixed;top:8px;right:8px;z-index:61;min-height:44px;padding:0 14px;font-size:16px}
.avv{display:block;color:#b00;font-weight:600;font-size:12px}
.sv{position:relative;display:inline-block;line-height:0}
.sv svg{display:block}
.spm{position:absolute;top:-2px;right:-6px;font-size:12px;line-height:1.1;white-space:nowrap;transform-origin:left bottom;transform:rotate(-45deg);font-weight:600}
.apt{position:absolute;top:34px;left:100%;margin-left:6px;font-size:13px;line-height:1.1;font-weight:700;color:var(--ink);white-space:nowrap}
.qtd{position:absolute;top:-4px;right:100%;margin-right:4px;font-size:12px;line-height:1.1;font-weight:700;white-space:nowrap}
.qta{font-weight:700}
.sis{border:1px solid #888;border-radius:6px;padding:0 5px;font-size:12px}
.etich{background:var(--hi);border:1px solid #e0c870;border-radius:8px;padding:0 7px;font-size:12px;text-transform:uppercase}
.cell .add{margin:auto;font-size:38px;color:var(--line)}
.dw{display:flex;justify-content:center;align-items:center;gap:6px}
.vt{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.cell .m{text-align:center}
.m{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.pre{color:var(--mut);text-decoration:line-through;font-size:12px}
.ks{position:absolute;bottom:6px;right:6px;display:flex;flex-direction:column;gap:2px}
.k{width:20px;height:20px;border:1px solid var(--line);border-radius:50%;font-size:12px;display:grid;place-items:center;color:var(--line)}
.k.on{color:#fff;background:var(--ok);border-color:var(--ok)}
.firma{border:1px solid var(--ink);background:#fff;touch-action:none;width:100%;max-width:500px;height:140px;display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:none}
.ov.on{display:block}
.ed{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:#fff;overflow:auto;padding:14px 16px 90px}
.ed h3{margin:14px 0 6px;font-size:15px;color:var(--red);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:6px}
.f{display:flex;flex-direction:column;font-size:13px;color:var(--mut);flex:1;min-width:120px}
.f input,.f select,.f textarea{min-height:48px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:20px;color:var(--ink);background:#fff;width:100%}
.f input:focus,.f textarea:focus{outline:3px solid var(--red);background:var(--hi)}
.f textarea{font-size:16px;min-height:80px}
.f small{font-size:12px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;padding:4px 12px;border:1px solid var(--line);border-radius:22px;background:#fff}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.al{min-width:96px;min-height:48px;border:2px solid var(--ink);border-radius:8px;background:#fff;font-weight:700}
.al.v0{background:#e6e6e6}
.al.v1{background:var(--hi)}
.al.v2{background:var(--red);color:#fff;border-color:var(--red)}
.draw{display:flex;flex-wrap:wrap;gap:8px}
.draw button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px;width:92px;font-size:11px}
.draw button.on{border:3px solid var(--red);padding:2px}
.dis{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.box{background:#f6f6f6;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;font-size:14px;margin-bottom:6px}
.foot{position:fixed;right:0;bottom:0;width:min(560px,100%);background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px}
.foot button{min-height:50px;flex:1;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:600}
.foot .pri{background:var(--red);color:#fff;border-color:var(--red)}
.foot .del{flex:0 0 auto;color:var(--red)}
.hint{font-size:13px;color:var(--mut);margin:4px 0}
@media print{
 .bar,.ov,.noprint{display:none!important}
 body{background:#fff}
 .wrap{padding:0;max-width:none}
 .page{border:0;margin:0;padding:0;max-width:none;page-break-after:always}
 .cell{min-height:80mm}
 .cell:active{background:none}
 .tr{border:0;padding:0}
}
</style>
</head>
<body>
<div class="bar noprint" id="bar"></div>
<div class="wrap" id="wrap"></div>
<div id="pv"><button id="pvx">Chiudi piantina</button><img id="pvi" alt="Piantina"></div>
<div class="ov" id="ov"><div class="ed" id="ed"></div><div class="foot" id="foot"></div></div>

<script>
"use strict";
const VERSIONE='v09';
/* Nomi dei modelli: R1 Rilievo, E1 Esecutivo, M1 Monoblocco, T1 Controtelai, C1 Collaudo */
const MODELLI=[['ril','R1 Rilievo'],['esec','E1 Esecutivo'],['mono','M1 Monoblocco'],['ctel','T1 Controtelai'],['coll','C1 Collaudo']];
const LS='rilievi_corrado_v2';
const STANZE=['Soggiorno','Cucina','Camera','Cameretta','Bagno','Studio','Ingresso','Corridoio','Scala','Salone','Letto 1','Letto 2','Letto 3','Lavanderia','Stanzino'];
const SISTEMI=['S44','EVO2','PVC','Fiber'];
const APERTURE=[['VIT','Vista interna, tirare'],['VISP','Vista interna, spingere'],['VET','Vista esterna, tirare'],['VESP','Vista esterna, spingere']];
const ETICHETTE=['Vetrata','Persiana','Scorrevole','Serratura','Soglietta','Zoccolino','Muratore','Zanzariera','Telaio a giro','Portone'];
const ORDINE=['F','<','>','SR','SL'];
const DISEGNI=[['<','1 anta <'],['>','1 anta >'],['F','Fisso'],['F|<','Fisso + anta <'],['<|>','2 ante'],['F|F','2 fissi'],['SR|F','Scorrevole, fisso a destra'],['F|SL','Scorrevole, fisso a sinistra'],['F|<|F','Fisso, anta, fisso']];
const RAPIDE=['Fuori piano 30x2','Dentro silicone verniciabile','Fascetto esterno 3 lati','Scarichi frontali','Sotto polipan','Aletta 35','Controtelaio?'];
/* Sigle fisse: BF battuta frontale, BL battuta laterale, LST luce stipiti larghezza, HST luce stipiti altezza,
   L e H misura infisso, Lmax e Hmax luce massima */
const RIGHE=[[['BF','Battuta frontale BF'],['BL','Battuta laterale BL']],[['LST','Luce stipiti LST'],['HST','Luce stipiti HST']],[['L','Misura infisso L'],['H','Misura infisso H']],[['Lmax','Luce max Lmax'],['Hmax','Luce max Hmax']],[['spMuro','Spessore muro']]];
const MIS_MONO=[['L','Larghezza (al cm)'],['H','Altezza (al cm)'],['spMuro','Spessore muro'],['cappotto','Cappotto'],['architrave','Architrave'],['sottobancale','Sottobancale'],['mezzeria','Mezzeria'],['BF','BF'],['BL','BL']];
const MIS_CTEL=[['L','Larghezza controtelaio'],['H','Altezza controtelaio'],['BF','BF'],['BL','BL']];
const PIANI=['Semint.','PT','1','2','3','4','5+','Mansarda'];
const MEZZI=['A mano','Scala interna','Scala esterna','Ponteggio','Elevatore','Gru','Autogru'];

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(n===undefined||n===null||n==='')?'':String(n).replace('.',',');
function parseMm(s){s=String(s).trim().toLowerCase().replace(/mm|\s/g,'').replace(',','.');const m=s.match(/-?\d+(\.\d+)?/);return m?Math.round(parseFloat(m[0])*10)/10:null}
const lettera=i=>String.fromCharCode(65+i%26)+(i>=26?Math.floor(i/26):'');
const nuovaPos=id=>({id,stanza:'',etichetta:'',qta:'',sistema:'',apertura:'',tipo:'',descrizione:'',nominale:{},complementi:[],verifica:[],vOk:false,origine:'',disegno:'<',note:'',ril:{},esec:{},ale:{sx:{t:''},dx:{t:''},su:{t:''},giu:{t:''}},mono:{},ctel:{},coll:{},prev:{},chk:{}});
const nuovaTrasp=()=>({piano:'',mezzi:[],gru:'',diff:'',note:''});
const nuovaCommessa=n=>({id:'c'+Date.now(),cliente:n,rif:'',luogo:'',data:new Date().toISOString().slice(0,10),colore:'',consegna:'',tipologia:'',firma:'',contratto:'',piantine:[],trasp:nuovaTrasp(),pos:[nuovaPos('A')]});

function demo(){
  const c=nuovaCommessa('Cliente di prova');c.rif='000/26';c.luogo='Modica';
  const a=c.pos[0];a.stanza='Soggiorno';a.disegno='<';a.etichetta='Serratura';
  a.ril={BF:54,BL:75,LST:904,HST:1250};
  a.esec={L:980,H:1950,BF:54,BL:75,LST:904,HST:1250};
  a.ale={sx:{t:'AL'},dx:{t:'ALn',n:35},su:{t:'AL'},giu:{t:'0'}};
  a.note='Dentro silicone verniciabile. Fuori piano 30x2.';a.mono={L:1100,H:2350,spMuro:330};a.ctel={L:1150,H:2400};
  const b=nuovaPos('B');b.stanza='Bagno';b.disegno='SR|F';b.etichetta='Persiana';b.ril={LST:700,HST:1250};b.esec={L:765,H:1303};b.prev={'esec.L':760};
  c.pos.push(b);
  return {cur:c.id,modello:'ril',commesse:[c]};
}
let S=(function(){try{const s=JSON.parse(localStorage.getItem(LS));if(s&&s.commesse&&s.commesse.length)return s}catch(e){}return demo()})();
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const C=()=>S.commesse.find(c=>c.id===S.cur)||S.commesse[0];
const M=()=>S.modello;
const NOME=()=>MODELLI.find(x=>x[0]===M())[1];
const T=c=>c.trasp||(c.trasp=nuovaTrasp());

function getp(p,path){return path.split('.').reduce((o,k)=>o&&o[k],p)}
function setp(p,path,v){const ks=path.split('.');let o=p;for(let i=0;i<ks.length-1;i++){o[ks[i]]=o[ks[i]]||{};o=o[ks[i]]}o[ks[ks.length-1]]=v}
const alS=a=>(!a||!a.t)?'_':a.t==='0'?'0':a.t==='AL'?'AL':a.t==='N'?(a.n===undefined||a.n===null?'?':fmt(a.n)):'AL('+(a.n||'?')+')';

/* ---------- disegno: F fisso, < > anta, SR SL scorrevole (freccia verso il centro) ---------- */
function svgTipo(code,w,h,inter){
  w=w||60;h=h||80;const panes=code.split('|'),pw=w/panes.length,m=h/2;
  let s='<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" fill="none" stroke="#1c1c1c" stroke-width="1.8">';
  s+='<rect x="1" y="1" width="'+(w-2)+'" height="'+(h-2)+'"/>';
  panes.forEach((t,i)=>{const x0=i*pw,x1=(i+1)*pw;if(i>0)s+='<line x1="'+x0+'" y1="1" x2="'+x0+'" y2="'+(h-1)+'"/>';
    if(t==='<')s+='<polyline points="'+(x1-6)+',6 '+(x0+6)+','+m+' '+(x1-6)+','+(h-6)+'"/>';
    else if(t==='>')s+='<polyline points="'+(x0+6)+',6 '+(x1-6)+','+m+' '+(x0+6)+','+(h-6)+'"/>';
    else if(t==='F')s+='<text x="'+((x0+x1)/2)+'" y="'+(m+6)+'" text-anchor="middle" font-size="'+Math.min(22,pw*0.5)+'" fill="#1c1c1c" stroke="none">F</text>';
    else if(t==='SR')s+='<line x1="'+(x0+8)+'" y1="'+m+'" x2="'+(x1-8)+'" y2="'+m+'"/><polyline points="'+(x1-16)+','+(m-6)+' '+(x1-8)+','+m+' '+(x1-16)+','+(m+6)+'"/>';
    else if(t==='SL')s+='<line x1="'+(x0+8)+'" y1="'+m+'" x2="'+(x1-8)+'" y2="'+m+'"/><polyline points="'+(x0+16)+','+(m-6)+' '+(x0+8)+','+m+' '+(x0+16)+','+(m+6)+'"/>';
    if(inter)s+='<rect data-pane="'+i+'" x="'+x0+'" y="0" width="'+pw+'" height="'+h+'" fill="rgba(255,255,255,0.01)" stroke="none" style="cursor:pointer"/>';
  });
  return s+'</svg>';
}

/* ---------- barra e fogli ---------- */
function renderBar(){
  const c=C();
  document.getElementById('bar').innerHTML=
   '<span class="ver">Rilievi '+VERSIONE+'</span><select id="selC">'+S.commesse.map(x=>'<option value="'+x.id+'"'+(x.id===c.id?' selected':'')+'>'+esc(x.cliente||'(senza nome)')+'</option>').join('')+'</select>'+
   '<button id="nuovaC">+ Cliente</button>'+
   MODELLI.map(m=>'<button class="tab'+(m[0]===M()?' on':'')+'" data-m="'+m[0]+'">'+m[1]+'</button>').join('')+
   '<button id="bCant" class="pri">Cantieri</button><button id="bApri">Apri da file</button><button id="bPian">Piantina</button><button id="bPronto" class="pri">Pronto per uscire</button><span class="sp"></span><button id="bInv" class="pri">Invia al CRM</button><button id="bEsc">Esporta cantiere</button><button id="bPrint">Stampa / PDF</button><button id="bExp">Esporta</button><button id="bImp">Importa</button>'+
   '<input type="file" id="fImp" accept=".json" hidden><input type="file" id="fCant" accept=".json,application/pdf,image/*" multiple hidden><input type="file" id="fPian" accept="application/pdf,image/*" multiple hidden>';
}
function chkHtml(p){const k=p.chk[M()]||{};return '<span class="ks"><span class="k'+(k.c1?' on':'')+'">X</span><span class="k'+(k.c2?' on':'')+'">&#9711;</span><span class="k'+(k.c3?' on':'')+'">_</span></span>'}
function cellMis(p,m){
  const pf=m==='esec'?'esec':'ril',o=p[pf],a=p.ale,pre=k=>p.prev[pf+'.'+k]!==undefined?' <span class="pre">'+fmt(p.prev[pf+'.'+k])+'</span>':'';
  let h='';
  if(o.BF!==undefined||o.BL!==undefined)h+='<div class="m">BF '+fmt(o.BF)+'&emsp;BL '+fmt(o.BL)+'</div>';
  const sv='<span class="sv">'+svgTipo(p.disegno,70,84)+(o.spMuro!==undefined?'<span class="spm">sp. '+fmt(o.spMuro)+'</span>':'')+(p.apertura?'<span class="apt">'+esc(p.apertura)+'</span>':'')+(p.qta?'<span class="qtd">N° '+esc(p.qta)+'</span>':'')+'</span>';
  h+='<div class="dw"><div class="vt m">'+(o.H!==undefined?alS(a.giu)+' + '+fmt(o.H)+' + '+alS(a.su)+pre('H'):'')+'</div>'+sv+'</div>';
  if(o.L!==undefined)h+='<div class="m">'+alS(a.sx)+' + '+fmt(o.L)+' + '+alS(a.dx)+pre('L')+'</div>';
  if(o.LST!==undefined||o.HST!==undefined)h+='<div class="m">LST '+fmt(o.LST)+'&emsp;HST '+fmt(o.HST)+'</div>';
  return h;
}
function cellTop(p,m){
  const ril=m==='ril'||m==='esec',o=p[m==='esec'?'esec':'ril'];
  const mx=ril&&(o.Lmax!==undefined||o.Hmax!==undefined)?'<span class="m" style="font-size:12px;color:#333">Lmax '+fmt(o.Lmax)+'&emsp;Hmax '+fmt(o.Hmax)+'</span>':'';
  const ap=ril?'':(p.apertura?'<b>'+esc(p.apertura)+'</b>':'');
  return '<div class="top"><span>'+(p.sistema?esc(p.sistema):'&nbsp;')+'</span>'+mx+ap+'</div>';
}
function cellBody(p){
  const m=M();let mid='';
  const mis=(o,keys)=>keys.map(k=>o[k[0]]!==undefined&&o[k[0]]!==''?'<div class="m">'+k[0]+' '+fmt(o[k[0]])+'</div>':'').join('');
  if(m==='ril'||m==='esec')mid=cellMis(p,m);
  else if(m==='mono')mid=(p.mono.L!==undefined||p.mono.H!==undefined?'<div class="m" style="font-size:16px">'+fmt(p.mono.L)+' x '+fmt(p.mono.H)+'</div>':'')+mis(p.mono,MIS_MONO.slice(2));
  else if(m==='ctel')mid=(p.ctel.L!==undefined||p.ctel.H!==undefined?'<div class="m" style="font-size:16px">'+fmt(p.ctel.L)+' x '+fmt(p.ctel.H)+'</div>':'')+mis(p.ctel,MIS_CTEL.slice(2))+diffHtml(p,true);
  else if(m==='coll'){const c=p.coll;mid='<div class="dw">'+svgTipo(p.disegno,60,70)+'</div>'+(p.esec.L!==undefined?'<div class="m">'+alS(p.ale.sx)+' + '+fmt(p.esec.L)+' + '+alS(p.ale.dx)+'</div>':'')+(c.esito?'<div style="text-align:center"><b>'+esc(c.esito)+'</b></div>':'')+(c.L!==undefined||c.H!==undefined?'<div class="m">rilevato '+fmt(c.L)+' x '+fmt(c.H)+'</div>':'')+(c.mod?'<div class="nt">'+esc(c.mod)+'</div>':'')}
  return chkHtml(p)+cellTop(p,m)+(p.note&&m!=='coll'?'<div class="nt">'+esc(p.note)+'</div>':'')+mid+
    '<div class="pos"><b>'+esc(p.id)+'</b>'+(p.stanza?'<span class="stz">'+esc(p.stanza)+'</span>':' ')+(p.qta&&m!=='ril'&&m!=='esec'?' <span class="qta">N° '+esc(p.qta)+'</span>':'')+(p.etichetta?' <span class="etich">'+esc(p.etichetta)+'</span>':'')+((p.verifica&&p.verifica.length&&!p.vOk)?' <b style="color:#b00">?</b>':'')+(avvisiPos(p).length?' <b style="color:#b00" title="misura fuori limite">!</b>':'')+'</div>';
}
function traspS(c){const t=T(c),r=[];if(t.piano)r.push('Piano '+t.piano);if(t.mezzi.length)r.push('Scarico: '+t.mezzi.join(', '));if(t.gru)r.push('Gru: '+t.gru);if(t.diff)r.push('Difficoltà: '+t.diff);if(t.note)r.push(t.note);return r.join(' | ')}
function renderWrap(){
  const c=C(),n=c.pos.length,np=Math.max(1,Math.ceil((n+1)/9));let h='';
  for(let pg=0;pg<np;pg++){
    h+='<div class="page"><div class="head"><h2>FOGLIO MISURE</h2>'+
     hf('data','Data',c.data,'date')+hf('luogo','Luogo',c.luogo)+hf('cliente','Cliente',c.cliente)+hf('rif','Rif',c.rif)+
     '<label><span>Rilievo</span><b>'+NOME()+'</b></label>'+hf('tipologia','Tipologia',c.tipologia)+hf('colore','Colore',c.colore)+hf('consegna','Consegna',c.consegna)+'</div>';
    if(pg===0&&M()==='ril'){const s=traspS(c);h+='<div class="tr'+(s?'':' noprint')+'" data-trasp="1"><b>Trasporto e scarico:</b> '+(s?esc(s):'tocca per compilare (piano, gru, mezzo di scarico)')+'</div>'}
    h+='<div class="grid">';

function fileDaB64(x){const bin=atob(x.b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new File([u],x.name,{type:x.type})}

function formule(){aggiornaAvvisi();const el=document.getElementById('forms');if(!el||EI<0)return;const p=C().pos[EI],o=p[M()==='esec'?'esec':'ril'],a=p.ale;

function closeEd(){document.getElementById('ov').classList.remove('on');document.getElementById('ed').scrollTop=0;EI=-1;save();render()}
const MISURA=/^(ril|esec)\.(BF|BL|LST|HST|L|H|Lmax|Hmax|spMuro)$/,TESTO=['id','note','coll.mod','stanza','etichetta','qta','sistema'];
function applyField(el){
  if(EI===-2){if(el.dataset.tn){T(C()).note=el.value;save()}return}
  const p=C().pos[EI];if(!p)return;
  if(el.dataset.aln){const v=parseMm(el.value);p.ale[el.dataset.aln].n=v;el.value=fmt(v);formule();save();return}
  const path=el.dataset.p;if(!path)return;
  if(TESTO.includes(path)){setp(p,path,el.value);save();return}
  let v=el.value.trim()===''?undefined:parseMm(el.value);
  if((path==='mono.L'||path==='mono.H')&&v!==undefined&&v!==null)v=Math.round(v/10)*10;
  const old=getp(p,path);
  if(MISURA.test(path)&&old!==undefined&&v!==undefined&&v!==null&&old!==v)p.prev[path]=old;
  setp(p,path,v);el.value=fmt(v);formule();
  const d=document.getElementById('diff');if(d)d.innerHTML=diffHtml(p,false);
  save();
}

/* ---------- firma ---------- */
function iniFirma(){
  const cv=document.getElementById('fir'),x=cv.getContext('2d'),c=C();x.lineWidth=2;x.lineCap='round';
  if(c.firma){const im=new Image();im.onload=()=>x.drawImage(im,0,0);im.src=c.firma}
  let d=false;const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
  cv.onpointerdown=e=>{d=true;const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!d)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke()};
  cv.onpointerup=()=>{if(d){d=false;c.firma=cv.toDataURL();save()}};
}
